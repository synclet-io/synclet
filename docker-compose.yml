services:
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      DB_DSN: postgres://synclet:synclet@postgres:5432/synclet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  synclet:
    build: .
    command: ["server", "--standalone"]
    ports:
      - "8080:8080"
    environment:
      DB_DSN: postgres://synclet:synclet@postgres:5432/synclet?sslmode=disable
      WATERMILL_TRANSPORT: sql
      WATERMILL_SQL_DRIVER: "postgres"
      WATERMILL_SQL_CONSUMER_GROUP: "local"
      HTTP_SERVER_ADDR: 0.0.0.0:8080
      AUTH_JWT_SECRET: PA9XhBlfi6GZlJ8AFd3audLEfV9IcnV2
      SECRET_ENCRYPTION_KEY: PjsJSmk5MpLbSjsXYdIeflREhQ57B7+Sz0b0/VreDRk=
      INTERNAL_HTTP_SERVER_ADDR: "0.0.0.0:8087"
      ENVIRONMENT: production
      LOG_LEVEL: info
      # Scratch dir shared with the host so the host Docker daemon can
      # bind-mount per-task config/catalog/state files into spawned connector
      # containers. Path must match the volume mount below verbatim.
      DOCKER_EXECUTOR_TEMP_DIR_ROOT: /tmp/synclet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/synclet:/tmp/synclet
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: synclet
      POSTGRES_PASSWORD: synclet
      POSTGRES_DB: synclet
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
