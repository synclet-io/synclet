services:
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      DB_DSN: postgres://synclet:synclet@postgres:5432/synclet?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  synclet:
    build: .
    command: ["server", "--standalone"]
    ports:
      - "8080:8080"
    environment:
      DB_DSN: postgres://synclet:synclet@postgres:5432/synclet?sslmode=disable
      WATERMILL_TRANSPORT: sql
      WATERMILL_SQL_DRIVER: "postgres"
      WATERMILL_SQL_CONSUMER_GROUP: "local"
      PUBLIC_HTTP_SERVER_ADDR: 0.0.0.0:8080
      INTERNAL_HTTP_SERVER_ADDR: 0.0.0.0:8081
      # Generate each with `openssl rand -base64 32` and put them in .env next
      # to this file. Losing SECRET_ENCRYPTION_KEY makes stored connector
      # secrets unreadable.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in .env}
      ENVIRONMENT: development
      LOG_LEVEL: info
      # Scratch dir shared with the host so the host Docker daemon can
      # bind-mount per-task config/catalog/state files into spawned connector
      # containers. Path must match the volume mount below verbatim.
      DOCKER_EXECUTOR_TEMP_DIR_ROOT: /tmp/synclet
    # The image runs as UID 65532; join the group that owns the Docker socket
    # (`stat -c %g /var/run/docker.sock` on Linux, 0 on Docker Desktop/OrbStack).
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/synclet:/tmp/synclet
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: synclet
      POSTGRES_PASSWORD: synclet
      POSTGRES_DB: synclet
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
