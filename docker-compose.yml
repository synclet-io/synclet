x-synclet-image: &synclet-image ghcr.io/synclet-io/synclet:0.16.0 # x-release-please-version

x-synclet-env: &synclet-env
  DB_DSN: postgres://synclet:synclet@postgres:5432/synclet?sslmode=disable

services:
  migrate:
    image: *synclet-image
    command: ["migrate", "up"]
    env_file: &synclet-env-files
      - .env.compose
      - path: .env
        required: false
    environment: *synclet-env
    depends_on:
      postgres:
        condition: service_healthy

  # The Docker daemon creates a missing /tmp/synclet_local owned by root with
  # mode 0755, which connectors running as another user cannot write to; this
  # makes it 1777 (sticky, like /tmp). The Synclet image has no shell, so the
  # postgres image the stack already pulls does the chmod.
  local-root:
    image: postgres:16
    entrypoint: ["chmod", "1777", "/tmp/synclet_local"]
    user: "0:0"
    volumes:
      - /tmp/synclet_local:/tmp/synclet_local

  synclet:
    image: *synclet-image
    command: ["server", "--standalone"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file: *synclet-env-files
    environment:
      <<: *synclet-env
      # Owner label on the connector containers this executor starts; its
      # orphan cleanup removes only containers carrying it. A second stack on
      # the same Docker daemon must set another DOCKER_EXECUTOR_OWNER_ID.
      DOCKER_EXECUTOR_OWNER_ID: ${DOCKER_EXECUTOR_OWNER_ID:-synclet}
      WATERMILL_TRANSPORT: sql
      WATERMILL_SQL_DRIVER: "postgres"
      WATERMILL_SQL_CONSUMER_GROUP: "local"
      PUBLIC_HTTP_SERVER_ADDR: 0.0.0.0:8080
      INTERNAL_HTTP_SERVER_ADDR: 0.0.0.0:8081
      LOG_LEVEL: info
      # Scratch dir shared with the host so the host Docker daemon can
      # bind-mount per-task config/catalog/state files into spawned connector
      # containers. Path must match the volume mount below verbatim.
      DOCKER_EXECUTOR_TEMP_DIR_ROOT: /tmp/synclet
      # Mounted at /local in every connector container and never cleaned:
      # file-writing destinations (duckdb, csv, local-json, sqlite) leave their
      # files here on the host. Path must match the volume mount below verbatim.
      DOCKER_EXECUTOR_LOCAL_ROOT: /tmp/synclet_local
    # Root reaches the Docker socket whatever group owns it on the host, and
    # writes to /tmp/synclet and /tmp/synclet_local, which the daemon creates
    # root-owned. Access to the socket is root-equivalent on the host either way.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/synclet:/tmp/synclet
      - /tmp/synclet_local:/tmp/synclet_local
    depends_on:
      migrate:
        condition: service_completed_successfully
      local-root:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: synclet
      POSTGRES_PASSWORD: synclet
      POSTGRES_DB: synclet
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synclet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
