services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: synclet
      POSTGRES_PASSWORD: synclet
      POSTGRES_DB: synclet
    # POSTGRES_PORT moves the host port when 5432 is taken.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Catches outgoing email: SMTP on :1025, web UI and API on http://localhost:8025.
  # MAILPIT_SMTP_PORT / MAILPIT_UI_PORT move them when those host ports are taken.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
