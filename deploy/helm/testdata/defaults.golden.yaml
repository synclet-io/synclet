# Source: synclet/templates/server/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t-synclet-server
  labels:
    helm.sh/chart: synclet-CHART_VERSION
    app.kubernetes.io/name: synclet
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: synclet
    app.kubernetes.io/component: server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: synclet
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: SHA256
        checksum/secret: SHA256
      labels:
        app.kubernetes.io/name: synclet
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: t-synclet
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      initContainers:
        - name: wait-postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h t-synclet-postgres -p 5432 -U synclet; do echo 'waiting for postgres...'; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: migrate
          image: ghcr.io/synclet-io/synclet:APP_VERSION
          imagePullPolicy: IfNotPresent
          command: ["synclet", "migrate", "up"]
          envFrom:
            - configMapRef:
                name: t-synclet
          env:
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt-secret
                  name: t-synclet-secrets
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: encryption-key
                  name: t-synclet-secrets
            - name: PIPELINE_EXECUTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: internal-api-secret
                  name: t-synclet-secrets
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  key: db-dsn
                  name: t-synclet-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: synclet
          image: ghcr.io/synclet-io/synclet:APP_VERSION
          imagePullPolicy: IfNotPresent
          command: ["synclet", "server", "--standalone"]
          ports:
            - name: public
              containerPort: 8080
              protocol: TCP
            - name: internal
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: t-synclet
          env:
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  key: jwt-secret
                  name: t-synclet-secrets
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: encryption-key
                  name: t-synclet-secrets
            - name: PIPELINE_EXECUTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: internal-api-secret
                  name: t-synclet-secrets
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  key: db-dsn
                  name: t-synclet-secrets
          startupProbe:
            httpGet:
              path: /live
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: internal
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: internal
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
