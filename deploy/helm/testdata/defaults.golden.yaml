# Source: synclet/templates/postgres/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t-synclet-postgres
  labels:
    helm.sh/chart: synclet-CHART_VERSION
    app.kubernetes.io/name: synclet
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: synclet
    app.kubernetes.io/component: postgres
spec:
  serviceName: t-synclet-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synclet
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synclet
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgres
          env:
            - name: POSTGRES_USER
              value: synclet
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: t-synclet-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              value: synclet
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "synclet", "-d", "synclet"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "synclet", "-d", "synclet"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "synclet", "-d", "synclet"]
            periodSeconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
