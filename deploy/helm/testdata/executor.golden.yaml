---
# Source: synclet/templates/executor/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: t-synclet-executor
  labels:
    helm.sh/chart: synclet-CHART_VERSION
    app.kubernetes.io/name: synclet
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: "APP_VERSION"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: synclet
    app.kubernetes.io/component: executor
spec:
  serviceName: t-synclet-executor
  podManagementPolicy: Parallel
  replicas: 1
  revisionHistoryLimit: 3
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: synclet
      app.kubernetes.io/instance: t
      app.kubernetes.io/component: executor
  template:
    metadata:
      annotations:
        checksum/config: SHA256
        checksum/secret: SHA256
        synclet.io/executor-group: "Prod Cluster ACME"
      labels:
        app.kubernetes.io/name: synclet
        app.kubernetes.io/instance: t
        app.kubernetes.io/component: executor
    spec:
      serviceAccountName: t-synclet-executor
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: executor
          image: ghcr.io/synclet-io/synclet:APP_VERSION
          imagePullPolicy: IfNotPresent
          command: ["synclet", "k8s-executor"]
          ports:
            - name: internal
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: t-synclet-executor
          env:
            - name: EXECUTOR_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: internal-api-secret
                  name: synclet-executor-token
            - name: K8S_EXECUTOR_OWNER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
