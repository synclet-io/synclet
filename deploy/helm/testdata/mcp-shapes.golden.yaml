kind: HTTPRoute
metadata:
  name: t-synclet
  labels:
    helm.sh/chart: VERSION
    app.kubernetes.io/name: synclet
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: synclet
    app.kubernetes.io/component: server
spec:
  parentRefs:
    - name: gw
  hostnames:
    - synclet.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/mcp"
        - path:
            type: PathPrefix
            value: "/.well-known/oauth-protected-resource"
        - path:
            type: PathPrefix
            value: "/.well-known/oauth-authorization-server"
        - path:
            type: PathPrefix
            value: "/oauth/register"
        - path:
            type: PathPrefix
            value: "/oauth/token"
      backendRefs:
        - name: t-synclet-mcp
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: t-synclet
          port: 80
### shared/ingress=true/gateway=true/hostname=false/parentRefs=false/customPaths=true
---
# Source: synclet/templates/server/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t-synclet
  labels:
    helm.sh/chart: VERSION
    app.kubernetes.io/name: synclet
    app.kubernetes.io/instance: t
    app.kubernetes.io/version: VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: synclet
    app.kubernetes.io/component: server
spec:
  ingressClassName: nginx
  rules:
    - host: synclet.local
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: t-synclet-mcp
                port:
                  number: 80
          - path: /custom
            pathType: Prefix
            backend:
              service:
                name: t-synclet-mcp
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: t-synclet
                port:
                  number: 80
