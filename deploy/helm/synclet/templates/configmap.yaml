apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synclet.fullname" . }}
  labels:
    {{- include "synclet.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  PUBLIC_HTTP_SERVER_ADDR: {{ printf "0.0.0.0:%v" .Values.server.containerPorts.public | quote }}
  PUBLIC_HTTP_SERVER_CORS_ALLOW_ALL_ORIGINS: {{ .Values.corsAllowAllOrigins | quote }}
  INTERNAL_HTTP_SERVER_ADDR: {{ printf "0.0.0.0:%v" .Values.server.containerPorts.internal | quote }}
  ## Auth
  AUTH_REGISTRATION_ENABLED: {{ .Values.auth.registrationEnabled | quote }}
  AUTH_SECURE_COOKIES: {{ .Values.auth.secureCookies | quote }}
  AUTH_ACCESS_TOKEN_TTL: {{ .Values.auth.accessTokenTTL | quote }}
  AUTH_REFRESH_TOKEN_TTL: {{ .Values.auth.refreshTokenTTL | quote }}
  AUTH_OIDC_STATE_TTL: {{ .Values.auth.oidcStateTTL | quote }}
  AUTH_MIN_PASSWORD_LENGTH: {{ .Values.auth.minPasswordLength | quote }}
  ## Workspace
  WORKSPACE_MODE: {{ .Values.workspaces.mode | quote }}
  ## Frontend & invites
  WORKSPACE_FRONTEND_URL: {{ include "synclet.frontendURL" . | quote }}
  WORKSPACE_INVITE_TTL: {{ .Values.invites.ttl | quote }}
  ## SMTP (non-secret)
  {{- if .Values.smtp.host }}
  NOTIFY_SMTP_HOST: {{ .Values.smtp.host | quote }}
  NOTIFY_SMTP_PORT: {{ .Values.smtp.port | quote }}
  NOTIFY_SMTP_USER: {{ .Values.smtp.user | quote }}
  NOTIFY_SMTP_FROM: {{ .Values.smtp.from | quote }}
  {{- end }}
  ## Notify: webhook settings
  NOTIFY_WEBHOOK_HTTP_TIMEOUT: {{ .Values.notify.webhookHTTPTimeout | quote }}
  NOTIFY_WEBHOOK_MAX_RETRIES: {{ .Values.notify.webhookMaxRetries | quote }}
  ## Pipeline: worker & scheduling
  PIPELINE_JOB_WORKER_INTERVAL: {{ .Values.pipeline.workerInterval | quote }}
  PIPELINE_JOB_SCHEDULER_INTERVAL: {{ .Values.pipeline.schedulerInterval | quote }}
  PIPELINE_JOB_WATCHDOG_INTERVAL: {{ .Values.pipeline.watchdogInterval | quote }}
  DOCKER_EXECUTOR_JOB_CLEANUP_INTERVAL: {{ .Values.pipeline.dockerResourceCleanupInterval | quote }}
  ## Docker executor: sync limits
  DOCKER_EXECUTOR_MAX_SYNC_DURATION: {{ .Values.pipeline.maxSyncDuration | quote }}
  DOCKER_EXECUTOR_MAX_CONCURRENT_JOBS: {{ .Values.pipeline.maxConcurrentJobs | quote }}
  PIPELINE_IDLE_TIMEOUT: {{ .Values.pipeline.idleTimeout | quote }}
  ## Pipeline: connector tasks
  PIPELINE_CONNECTOR_TASK_RETENTION: {{ .Values.pipeline.connectorTaskRetention | quote }}
  PIPELINE_CONNECTOR_TASK_TIMEOUT: {{ .Values.pipeline.connectorTaskTimeout | quote }}
  PIPELINE_DEFAULT_MAX_ATTEMPTS: {{ .Values.pipeline.defaultMaxAttempts | quote }}
  DOCKER_EXECUTOR_HEARTBEAT_INTERVAL: {{ .Values.pipeline.heartbeatInterval | quote }}
  PIPELINE_CONNECTION_CHECK_TIMEOUT: {{ .Values.pipeline.connectionCheckTimeout | quote }}
  PIPELINE_CONNECTOR_TASK_POLL_INTERVAL: {{ .Values.pipeline.connectorTaskPollInterval | quote }}
  PIPELINE_EVENT_EMIT_TIMEOUT: {{ .Values.pipeline.eventEmitTimeout | quote }}
  PIPELINE_STATS_ROLLUP_HOURLY_LOOKBACK: {{ .Values.pipeline.statsRollupHourlyLookback | quote }}
  PIPELINE_STATS_ROLLUP_DAILY_LOOKBACK: {{ .Values.pipeline.statsRollupDailyLookback | quote }}
  PIPELINE_REGISTRY_FETCH_TIMEOUT: {{ .Values.pipeline.registryFetchTimeout | quote }}
  ## Pipeline: default K8s resources for connector pods
  {{- if .Values.pipeline.resources.cpuRequest }}
  PIPELINE_RUNTIME_CPU_REQUEST: {{ .Values.pipeline.resources.cpuRequest | quote }}
  {{- end }}
  {{- if .Values.pipeline.resources.cpuLimit }}
  PIPELINE_RUNTIME_CPU_LIMIT: {{ .Values.pipeline.resources.cpuLimit | quote }}
  {{- end }}
  {{- if .Values.pipeline.resources.memoryRequest }}
  PIPELINE_RUNTIME_MEMORY_REQUEST: {{ .Values.pipeline.resources.memoryRequest | quote }}
  {{- end }}
  {{- if .Values.pipeline.resources.memoryLimit }}
  PIPELINE_RUNTIME_MEMORY_LIMIT: {{ .Values.pipeline.resources.memoryLimit | quote }}
  {{- end }}
  {{- if .Values.pipeline.resources.serviceAccountName }}
  PIPELINE_RUNTIME_SERVICE_ACCOUNT_NAME: {{ .Values.pipeline.resources.serviceAccountName | quote }}
  {{- end }}
  ## OIDC (non-secret fields)
  {{- if .Values.oidc.providers }}
  AUTH_OIDC_PROVIDERS: {{ include "synclet.oidcProviderSlugs" . | quote }}
  AUTH_OIDC_CALLBACK_BASE_URL: {{ (.Values.oidc.callbackBaseURL | default (include "synclet.frontendURL" .)) | quote }}
  {{- range .Values.oidc.providers }}
  {{- $slug := upper .slug }}
  AUTH_OIDC_{{ $slug }}_ISSUER: {{ .issuer | quote }}
  AUTH_OIDC_{{ $slug }}_CLIENT_ID: {{ .clientID | quote }}
  {{- if .displayName }}
  AUTH_OIDC_{{ $slug }}_DISPLAY_NAME: {{ .displayName | quote }}
  {{- end }}
  {{- if .scopes }}
  AUTH_OIDC_{{ $slug }}_SCOPES: {{ .scopes | quote }}
  {{- end }}
  {{- if .roleClaim }}
  AUTH_OIDC_{{ $slug }}_ROLE_CLAIM: {{ .roleClaim | quote }}
  {{- end }}
  {{- if .roleMapAdmin }}
  AUTH_OIDC_{{ $slug }}_ROLE_MAP_ADMIN: {{ .roleMapAdmin | quote }}
  {{- end }}
  {{- if .roleMapEditor }}
  AUTH_OIDC_{{ $slug }}_ROLE_MAP_EDITOR: {{ .roleMapEditor | quote }}
  {{- end }}
  {{- if .roleMapViewer }}
  AUTH_OIDC_{{ $slug }}_ROLE_MAP_VIEWER: {{ .roleMapViewer | quote }}
  {{- end }}
  {{- if .defaultRole }}
  AUTH_OIDC_{{ $slug }}_DEFAULT_ROLE: {{ .defaultRole | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .autoCreateUser) }}
  AUTH_OIDC_{{ $slug }}_AUTO_CREATE_USER: {{ .autoCreateUser | quote }}
  {{- end }}
  {{- if .allowedDomains }}
  AUTH_OIDC_{{ $slug }}_ALLOWED_DOMAINS: {{ .allowedDomains | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  ## Executor (distributed mode: jobs need the executor URL)
  {{- if eq .Values.mode "distributed" }}
  EXECUTOR_API_URL: {{ include "synclet.internalServerAddr" . | quote }}
  {{- end }}
  ## Kubernetes
  {{- if or .Values.executor.enabled (eq .Values.mode "standalone") }}
  K8S_EXECUTOR_NAMESPACE: {{ .Values.k8s.namespace | quote }}
  K8S_EXECUTOR_SYNCLET_IMAGE: {{ include "synclet.image" . | quote }}
  K8S_EXECUTOR_SERVER_ADDR: {{ include "synclet.internalServerAddr" . | quote }}
  K8S_EXECUTOR_DEFAULT_MEMORY: {{ .Values.k8s.defaultMemory | quote }}
  K8S_EXECUTOR_DEFAULT_CPU: {{ .Values.k8s.defaultCPU | quote }}
  {{- if .Values.k8s.imagePullSecret }}
  K8S_EXECUTOR_IMAGE_PULL_SECRET: {{ .Values.k8s.imagePullSecret | quote }}
  {{- end }}
  {{- end }}
