{{- if and .Values.logArchive.garage.enabled (not .Values.logArchive.garage.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synclet.garage.fullname" . }}
  labels:
    {{- include "synclet.garage.labels" . | nindent 4 }}
  annotations:
    ## Garage keeps the access key on its volume, which outlives the release, and refuses
    ## to start when the Secret no longer matches it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range list "rpc-secret" "admin-token" "access-key-id" "secret-access-key" }}
  {{ . }}: {{ include "synclet.garage.secretValue" (dict "ctx" $ "key" .) | quote }}
  {{- end }}
{{- end }}
