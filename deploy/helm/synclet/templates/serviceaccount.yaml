{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synclet.serviceAccountName" . }}
  labels:
    {{- include "synclet.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- $executorSA := .Values.executor.serviceAccount | default (dict "create" true) }}
{{- if and (include "synclet.executor.ownServiceAccount" .) $executorSA.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synclet.executor.serviceAccountName" . }}
  labels:
    {{- include "synclet.executor.labels" . | nindent 4 }}
  {{- with $executorSA.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- $connectorSA := .Values.pipeline.serviceAccount | default dict }}
{{- if $connectorSA.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synclet.pipeline.serviceAccountName" . }}
  namespace: {{ .Values.k8s.namespace | default .Release.Namespace }}
  labels:
    {{- include "synclet.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
  {{- with $connectorSA.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
