{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synclet.serviceAccountName" . }}
  labels:
    {{- include "synclet.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and (include "synclet.executor.ownServiceAccount" .) .Values.executor.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synclet.executor.serviceAccountName" . }}
  labels:
    {{- include "synclet.executor.labels" . | nindent 4 }}
  {{- with .Values.executor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.pipeline.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synclet.pipeline.serviceAccountName" . }}
  namespace: {{ .Values.k8s.namespace | default .Release.Namespace }}
  labels:
    {{- include "synclet.labels" . | nindent 4 }}
    app.kubernetes.io/component: connector
  {{- with .Values.pipeline.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
