{{- if include "synclet.runsExecutor" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "synclet.fullname" . }}-executor
  labels:
    {{- include "synclet.executor.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.server.containerPorts.internal }}
      targetPort: internal
      protocol: TCP
      name: internal
  selector:
    {{- include "synclet.executor.selectorLabels" . | nindent 4 }}
{{- end }}
