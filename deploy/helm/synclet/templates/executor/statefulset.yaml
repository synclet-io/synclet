{{- /* executor.strategy default of releases before 0.4.0, which --reuse-values carries over */}}
{{- $legacyStrategy := dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 1 "maxUnavailable" 0) }}
{{- if and .Values.executor.strategy (ne (toJson .Values.executor.strategy) (toJson $legacyStrategy)) }}
{{- fail "executor.strategy was renamed to executor.updateStrategy: the executor is a StatefulSet now, whose updateStrategy takes type RollingUpdate or OnDelete (no maxSurge)" }}
{{- end }}
{{- if and (eq .Values.mode "distributed") .Values.executor.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "synclet.fullname" . }}-executor
  labels:
    {{- include "synclet.executor.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "synclet.fullname" . }}-executor
  podManagementPolicy: Parallel
  replicas: {{ .Values.executor.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.executor.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "synclet.executor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/executor/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.executor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "synclet.executor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "synclet.executor.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.executor.priorityClassName }}
      priorityClassName: {{ .Values.executor.priorityClassName }}
      {{- end }}
      {{- if .Values.executor.podSecurityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.executor.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.executor.podSecurityContext.runAsUser }}
        fsGroup: {{ .Values.executor.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
        - name: executor
          image: {{ include "synclet.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["synclet", "k8s-executor"]
          ports:
            - name: internal
              containerPort: {{ .Values.server.containerPorts.internal }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "synclet.fullname" . }}-executor
            {{- with .Values.executor.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "synclet.env" (dict "ctx" $ "base" (include "synclet.executorSecretEnvVars" .) "extraEnv" .Values.executor.extraEnv) | nindent 12 }}
          {{- if .Values.executor.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ include "synclet.probePath" (list .Values.executor.livenessProbe "8080" "/live") }}
              port: {{ include "synclet.probePort" (list .Values.executor.livenessProbe "8080") }}
            initialDelaySeconds: {{ .Values.executor.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.executor.livenessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.executor.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ include "synclet.probePath" (list .Values.executor.readinessProbe "8080" "/ready") }}
              port: {{ include "synclet.probePort" (list .Values.executor.readinessProbe "8080") }}
            initialDelaySeconds: {{ .Values.executor.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.executor.readinessProbe.periodSeconds }}
          {{- end }}
          {{- if .Values.executor.containerSecurityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.executor.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.executor.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.executor.containerSecurityContext.capabilities.drop | nindent 16 }}
          {{- end }}
          resources:
            {{- toYaml .Values.executor.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.executor.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.executor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
