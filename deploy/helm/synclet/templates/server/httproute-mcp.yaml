{{- if include "synclet.mcpRoute" . }}
{{- $mcp := include "synclet.mcp" . | fromYaml }}
{{- if not $mcp.gateway.parentRefs }}
{{- fail "mcp.gateway.parentRefs is required when mcp.ingress.mode is separate and server.gateway.enabled is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "synclet.fullname" . }}-mcp
  labels:
    {{- include "synclet.server.labels" . | nindent 4 }}
    {{- with $mcp.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $mcp.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range $mcp.gateway.parentRefs }}
    - name: {{ required "mcp.gateway.parentRefs[].name is required" .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with $mcp.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range $mcp.ingress.paths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "synclet.fullname" . }}-mcp
          port: {{ $mcp.service.port }}
      {{- with $mcp.gateway.timeouts }}
      timeouts:
        {{- with .request }}
        request: {{ . | quote }}
        {{- end }}
        {{- with .backendRequest }}
        backendRequest: {{ . | quote }}
        {{- end }}
      {{- end }}
{{- end }}
