{{- if eq .Values.mode "distributed" }}
{{- include "synclet.pdb" (dict
  "pdb" .Values.server.pdb
  "replicas" .Values.server.replicaCount
  "name" (printf "%s-server" (include "synclet.fullname" .))
  "labels" (include "synclet.server.labels" .)
  "selectorLabels" (include "synclet.server.selectorLabels" .)) }}
{{- end }}
