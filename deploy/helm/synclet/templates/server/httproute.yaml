{{- if dig "gateway" "enabled" false .Values.server }}
{{- if not .Values.server.gateway.parentRefs }}
{{- fail "server.gateway.enabled needs server.gateway.parentRefs (the Gateway the HTTPRoute attaches to)" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "synclet.fullname" . }}
  labels:
    {{- include "synclet.server.labels" . | nindent 4 }}
    {{- with .Values.server.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.server.gateway.parentRefs }}
    - name: {{ required "server.gateway.parentRefs[].name is required" .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- with .port }}
      port: {{ . }}
      {{- end }}
    {{- end }}
  {{- with .Values.server.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- range .Values.server.gateway.paths }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .value | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "synclet.fullname" . }}
          port: {{ .Values.server.service.ports.public }}
      {{- with .Values.server.gateway.timeouts }}
      timeouts:
        {{- with .request }}
        request: {{ . | quote }}
        {{- end }}
        {{- with .backendRequest }}
        backendRequest: {{ . | quote }}
        {{- end }}
      {{- end }}
{{- end }}
