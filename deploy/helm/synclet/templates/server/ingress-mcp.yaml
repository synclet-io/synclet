{{- if include "synclet.mcpIngress" . }}
{{- $mcp := include "synclet.mcp" . | fromYaml }}
{{- $hostname := required "mcp.ingress.hostname is required when mcp.exposure is separate and server.ingress.enabled is true" $mcp.ingress.hostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "synclet.fullname" . }}-mcp
  labels:
    {{- include "synclet.server.labels" . | nindent 4 }}
  {{- with $mcp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $mcp.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $mcp.ingress.tls }}
  tls:
    - hosts:
        - {{ $hostname }}
      secretName: {{ $mcp.ingress.tlsSecretName | default (printf "%s-mcp-tls" (include "synclet.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ $hostname }}
      http:
        paths:
          {{- range $mcp.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "synclet.fullname" $ }}-mcp
                port:
                  number: {{ $mcp.service.port }}
          {{- end }}
{{- end }}
