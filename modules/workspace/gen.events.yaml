    - name: WorkspaceUpdatedEventData
      id: 30002
      do_not_persists: true
      fields:
        - { name: OldData, type: "*Workspace" }
        - { name: NewData, type: "*Workspace" }

    - name: WorkspaceDeletedEventData
      id: 30003
      do_not_persists: true
      fields:
        - { name: Workspace, type: "*Workspace" }