types:
  enums:
    - name: OAuthAccessLevel
      values: [ Read, Actions, Write ]
      helpers:
        is_valid: true
        stringer: true
        is: true

  models:
    - name: User
      table_name: auth.users
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: Email, type: string, filterable: true }
        - { name: PasswordHash, type: string }
        - { name: Name, type: string }
        - { name: CreatedAt, type: timestamp }

    - name: RefreshToken
      table_name: auth.refresh_tokens
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: UserID, type: uuid, filterable: true }
        - { name: TokenHash, type: string, filterable: true }
        - { name: ExpiresAt, type: timestamp }
        - { name: CreatedAt, type: timestamp }

    - name: PasswordResetToken
      table_name: auth.password_reset_tokens
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: UserID, type: uuid, filterable: true }
        - { name: TokenHash, type: string, filterable: true }
        - { name: ExpiresAt, type: timestamp, filterable: true }
        - { name: CreatedAt, type: timestamp }

    - name: APIKey
      table_name: auth.api_keys
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: WorkspaceID, type: uuid, filterable: true }
        - { name: UserID, type: uuid, filterable: true }
        - { name: Name, type: string }
        - { name: KeyHash, type: string, filterable: true }
        - { name: LastUsedAt, type: "*timestamp" }
        - { name: ExpiresAt, type: "*timestamp" }
        - { name: OAuthGrantID, type: "*uuid", filterable: true, database_name: oauth_grant_id }
        - { name: OAuthLevel, type: "*OAuthAccessLevel", database_name: oauth_level }
        - { name: CreatedAt, type: timestamp }

    - name: OAuthClient
      table_name: auth.oauth_clients
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: ClientID, type: string, filterable: true }
        - { name: Name, type: string }
        - { name: RedirectURIs, type: "[]string", database_name: redirect_uris }
        - { name: LastGrantedAt, type: "*timestamp" }
        - { name: CreatedAt, type: timestamp }

    - name: OAuthCode
      table_name: auth.oauth_codes
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: CodeHash, type: string, filterable: true }
        - { name: ClientID, type: string, filterable: true }
        - { name: RedirectURI, type: string }
        - { name: CodeChallenge, type: string }
        - { name: UserID, type: uuid }
        - { name: WorkspaceID, type: uuid }
        - { name: Level, type: OAuthAccessLevel }
        - { name: ExpiresAt, type: timestamp, filterable: true }
        - { name: CreatedAt, type: timestamp }

    - name: OAuthGrant
      table_name: auth.oauth_grants
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: ClientID, type: string, filterable: true }
        - { name: UserID, type: uuid, filterable: true }
        - { name: WorkspaceID, type: uuid, filterable: true }
        - { name: Level, type: OAuthAccessLevel }
        - { name: CreatedAt, type: timestamp }

    - name: OAuthRefreshToken
      table_name: auth.oauth_refresh_tokens
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: GrantID, type: uuid, filterable: true }
        - { name: TokenHash, type: string, filterable: true }
        - { name: UsedAt, type: "*timestamp" }
        - { name: ExpiresAt, type: timestamp, filterable: true }
        - { name: CreatedAt, type: timestamp }

    - name: OIDCIdentity
      plural_name: OIDCIdentities
      table_name: auth.oidc_identities
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: UserID, type: uuid, filterable: true }
        - { name: ProviderSlug, type: string, filterable: true }
        - { name: Subject, type: string, filterable: true }
        - { name: Email, type: string }
        - { name: CreatedAt, type: timestamp }
        - { name: LastLoginAt, type: timestamp }

    - name: OIDCState
      table_name: auth.oidc_states
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: State, type: string, filterable: true }
        - { name: Verifier, type: string }
        - { name: ProviderSlug, type: string }
        - { name: ExpiresAt, type: timestamp }
        - { name: CreatedAt, type: timestamp }

    - name: RateLimit
      table_name: auth.rate_limits
      fields:
        - { name: ID, type: uuid, filterable: true }
        - { name: Key, type: string, filterable: true }
        - { name: Count, type: int }
        - { name: ExpiresAt, type: timestamp, filterable: true }
