name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synclet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        env:
          TEST_DATABASE_DSN: postgres://postgres:test@localhost:5432/synclet_test?sslmode=disable
        run: go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic
      - name: Print coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Enforce per-package coverage minimums
        run: ./scripts/coverage-gate.sh scripts/coverage-thresholds.txt coverage.out
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: synclet_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run e2e tests
        env:
          E2E_DATABASE_URL: postgres://postgres:test@localhost:5432/synclet_e2e?sslmode=disable
          E2E_MAILPIT_URL: http://localhost:8025
          E2E_MAILPIT_SMTP_PORT: "1025"
        run: task e2e

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: cd front && bun install --frozen-lockfile
      - name: Install generators
        run: |
          go install github.com/saturn4er/boilerplate-go/cmd/boilerplate-go@v1.7.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.19.1
      - name: Regenerate protobuf
        run: cd proto && ../front/node_modules/.bin/buf generate
      - name: Regenerate domain models and storage
        run: cd modules && boilerplate-go ./gen.yaml
      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::generated code is out of date; run task proto && task boilerplate-go and commit the result"
            exit 1
          fi

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0 # GOLANGCI_LINT_VERSION in Taskfile.yml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd front && bun install --frozen-lockfile
      - run: cd front && bun run lint
      - run: cd front && bun run type-check
      - run: cd front && bun run build
      - run: cd front && bunx playwright install --with-deps chromium
      - run: cd front && bun run test:a11y

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - run: helm lint deploy/helm/synclet
      - name: Check chart render-time guards
        run: ./deploy/helm/check-guards.sh
