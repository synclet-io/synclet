name: Build Binaries

on:
  push:
    tags:
      - 'synclet-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to embed in the build (e.g. 0.0.0-dev)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: cd front && bun install --frozen-lockfile

      - name: Build frontend
        run: cd front && bun run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front/dist
          retention-days: 1

  build:
    needs: build-frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            archive: tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: front/dist

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF#refs/tags/synclet-v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BIN_NAME="synclet"
          if [ "$GOOS" = "windows" ]; then
            BIN_NAME="synclet.exe"
          fi
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "dist/${BIN_NAME}" \
            .

      - name: Package archive
        id: archive
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          STAGE="synclet-v${VERSION}-${GOOS}-${GOARCH}"

          mkdir -p "out/${STAGE}"
          if [ "$GOOS" = "windows" ]; then
            cp dist/synclet.exe "out/${STAGE}/"
          else
            cp dist/synclet "out/${STAGE}/"
          fi
          cp README.md LICENSE CHANGELOG.md "out/${STAGE}/" 2>/dev/null || true

          cd out
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ARCHIVE_NAME="${STAGE}.zip"
            zip -r "${ARCHIVE_NAME}" "${STAGE}"
          else
            ARCHIVE_NAME="${STAGE}.tar.gz"
            tar -czf "${ARCHIVE_NAME}" "${STAGE}"
          fi

          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "archive_path=out/${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=out/${ARCHIVE_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive_name }}
          path: |
            ${{ steps.archive.outputs.archive_path }}
            ${{ steps.archive.outputs.checksum_path }}
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/synclet-v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: synclet-v*
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
